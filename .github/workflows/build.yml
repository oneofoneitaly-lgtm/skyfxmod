name: Build mods (by @Adryh01)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: skyfx-mod
            name: SkyFX
          - dir: yamods
            name: YAMods
          - dir: yamenu
            name: YAMenu
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Download Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Build mod
        run: gradle-2.14.1/bin/gradle setupCIWorkspace build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/${{ matrix.name }}-*.jar
