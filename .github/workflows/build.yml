name: Build mods (by @Adryh01)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: skyfx-mod
            name: SkyFX
          - dir: yamods
            name: YAMods
          - dir: yamenu
            name: YAMenu
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Download Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Build mod
        run: gradle-2.14.1/bin/gradle setupCIWorkspace build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/${{ matrix.name }}-*.jar

  weave:
    # the lightweight engine: YA CLIENT for the Weave loader (no Forge). A failure here must not block the Forge release.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.1.0"
      - name: Unpack the Weave sources (kept as one zip because GitHub web upload limits the number of files)
        run: unzip -q yaweave.zip -d yaweave
      - name: Build YA CLIENT (Weave)
        working-directory: yaweave
        run: |
          for i in 1 2 3 4 5; do
            gradle build --no-daemon --refresh-dependencies && exit 0
            rm -rf ~/.gradle/caches/modules-2/metadata-* || true
            echo "Build failed (try $i), probably a Maven network limit. Retrying in 60s..."
            sleep 60
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: YAWeave
          path: yaweave/build/libs/YAClient.jar

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build YA CLIENT launcher (no Electron, one small exe)
        working-directory: yalauncher
        shell: bash
        run: |
          go get github.com/jchv/go-webview2@latest
          go mod tidy
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico icon.ico -o rsrc_windows.syso
          CGO_ENABLED=0 go build -ldflags "-H=windowsgui -s -w -X main.repo=${{ github.repository }} -X main.version=${{ github.sha }}" -o "YA Client.exe" .

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: YA-CLIENT-Launcher
          path: yalauncher/YA Client.exe

  release:
    needs: [build, launcher, weave]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename jars (the launcher downloads them by fixed name)
        run: |
          mkdir out
          for n in SkyFX YAMods YAMenu; do
            f=$(ls artifacts/$n/*.jar | grep -v -e sources -e deobf | head -1)
            cp "$f" out/$n.jar
          done
          if [ -f artifacts/YAWeave/YAClient.jar ]; then cp artifacts/YAWeave/YAClient.jar out/YAWeave.jar; fi
          cp "artifacts/YA-CLIENT-Launcher/YA Client.exe" out/YA-CLIENT.exe
          printf '%s' '${{ github.sha }}' > out/version.txt
          ls -la out

      - name: Publish as release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest mods
          files: |
            out/*.jar
            out/YA-CLIENT.exe
            out/version.txt
